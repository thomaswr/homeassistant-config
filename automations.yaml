- id: '1680902169200'
  alias: Calculate WAN in delta
  description: ''
  trigger:
  - platform: state
    entity_id:
    - sensor.wan_in
  condition: []
  action:
  - service: input_number.set_value
    data_template:
      entity_id: input_number.wan_in_delta
      value: '{{ ((trigger.to_state.state | int - trigger.from_state.state | int)
        * 8 ) / ( as_timestamp(trigger.to_state.last_updated) - as_timestamp(trigger.from_state.last_updated)
        ) }}'
  mode: single
- id: '1680902476424'
  alias: Calculate WAN out delta
  description: ''
  trigger:
  - platform: state
    entity_id:
    - sensor.wan_out
  condition: []
  action:
  - service: input_number.set_value
    data_template:
      entity_id: input_number.wan_out_delta
      value: '{{ ((trigger.to_state.state | int - trigger.from_state.state | int)
        * 8 ) / ( as_timestamp(trigger.to_state.last_updated) - as_timestamp(trigger.from_state.last_updated)
        ) }}'
  mode: single
