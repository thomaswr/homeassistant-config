- id: '1701207607433'
  alias: Draw weather info on epaper on schedule
  description: ''
  trigger:
  - platform: time
    at: 06:45:00
  - platform: time
    at: 07:45:00
  - platform: time
    at: 08:45:00
  - platform: time
    at: '10:00:00'
  - platform: time
    at: '12:00:00'
  - platform: time
    at: '16:00:00'
  - platform: time
    at: '18:00:00'
  - platform: time
    at: '20:00:00'
  condition: []
  action:
  - service: open_epaper_link.drawcustom
    target:
      entity_id:
      - open_epaper_link.0000021f476a3b1a
    data:
      background: white
      rotate: 0
      payload:
      - type: text
        value: Wien
        x: 10
        y: 10
        size: 40
        color: black
      - type: icon
        value: weather-cloudy
        x: 120
        y: 0
        size: 60
        color: black
      - type: text
        value: '{{ now().hour }}:{{now().minute }}'
        x: 200
        y: 25
        size: 20
        color: black
      - type: icon
        value: battery-charging
        x: 252
        y: 5
        size: 18
        color: black
      - type: text
        value: '{{ states(''sensor.0000021f476a3b1a_battery'') }}%'
        x: 265
        y: 10
        size: 13
        color: black
      - type: text
        value: '{{ state_attr("weather.forecast_home", "temperature") }}°C'
        x: 10
        y: 60
        size: 28
        color: black
  mode: single
