- id: '1569684922737'
  alias: '[ADMIN] Notify On Travis Build Failure'
  trigger:
  - entity_id: sensor.thomaswr_homeassistant_config_last_build_state
    platform: state
    to: failed
  condition: []
  action:
  - data:
      message: TravisCI Build fehlgeschlagen
    service: notify.notify
  mode: single
- id: '1569744026924'
  alias: '[ADMIN] Notify On Low System Resources'
  trigger:
  - entity_id: sensor.memory_use_percent
    platform: numeric_state
    above: '90'
    for:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - above: '88'
    entity_id: sensor.processor_use
    platform: numeric_state
    for:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  condition: []
  action:
  - data:
      message: 'Alarm: Memory: {{ states(''sensor.memory_use_percent'') }}%, CPU:
        {{ states(''sensor.processor_use'') }}%'
    service: notify.notify
  mode: single
- id: '1587387244440'
  alias: '[ADMIN] Restart NGINX On Imminent Cert Expiry'
  description: ''
  trigger:
  - platform: template
    value_template: '{{ as_timestamp(states.sensor.cert_expiry_timestamp_emuha_duckdns_org.state)
      - as_timestamp(now()) < 604800 }}'
  condition: []
  action:
  - data:
      addon: core_nginx_proxy
    service: hassio.addon_restart
  - data:
      message: 'Cert noch bis {{states.sensor.cert_expiry_timestamp_emuha_duckdns_org.state}}
        gültig. Starte Nginx neu... '
    service: notify.notify
  mode: single
- id: '1588933782684'
  alias: '[ADMIN] Create weekly snapshot'
  description: ''
  trigger:
  - at: 04:00:00
    platform: time
  condition:
  - condition: time
    weekday:
    - sun
  action:
  - data:
      name: ({{now().strftime('%d.%m.%y')}})
    service: hassio.backup_full
  - data:
      message: Creating weekly snapshot...
    service: notify.notify
  mode: single
